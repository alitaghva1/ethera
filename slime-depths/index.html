<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!-- Release-prep pass: mobile viewport + iOS safe-area + prevent double-tap zoom on the canvas. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0a0810">
<!-- Declare that this page is already dark-themed and handles its own palette.
     Without this, some Chrome builds (esp. Windows 11 24H2 with "Auto Dark Mode
     for Web Contents" enabled) will apply a force-dark transform on top of the
     existing canvas art, which crushes mid-tones on our full-frame painted boss
     intros. This meta causes Chrome to skip that pass. -->
<meta name="color-scheme" content="dark">
<!-- Dark Reader & similar browser extensions honor this lock and skip the page
     entirely. Our page is already styled for dark and Dark Reader's filter
     pass inverts/darkens our boss-intro JPGs. -->
<meta name="darkreader-lock">
<!-- Inline SVG favicon — a gold diamond (matching the START node glyph)
     so the tab icon fits the game's manuscript/gold aesthetic, and no
     extra HTTP request or 404 for favicon.ico. -->
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><polygon points='16,4 28,16 16,28 4,16' fill='%23f4d9a0'/><polygon points='16,10 23,16 16,22 9,16' fill='%23c9a86a'/></svg>">
<title>Ethera</title>
<style>
  html, body { margin: 0; padding: 0; background: #0a0810; color: #ddd; font-family: system-ui, sans-serif; overflow: hidden; touch-action: none; overscroll-behavior: none; cursor: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='28' height='28' viewBox='0 0 28 28'><g fill='none' stroke='%23f4d9a0' stroke-width='1.4' opacity='0.85'><circle cx='14' cy='14' r='9' stroke-dasharray='3 3' opacity='0.45'/><line x1='14' y1='3' x2='14' y2='8'/><line x1='14' y1='20' x2='14' y2='25'/><line x1='3' y1='14' x2='8' y2='14'/><line x1='20' y1='14' x2='25' y2='14'/></g><circle cx='14' cy='14' r='1.4' fill='%23f4d9a0'/></svg>") 14 14, crosshair; }
  body { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  #stage { position: relative; }
  /* Canvas sizing: primary rule uses aspect-ratio (Safari 15+, all modern).
     The @supports fallback below covers older WebKit / first-gen iPads by
     using explicit max-width / max-height in viewport units that mathematically
     preserve 16:9 (177.77vh = 16/9 * 100vh, 56.25vw = 9/16 * 100vw). */
  canvas { display: block; cursor: none; background: #0a0810; image-rendering: pixelated; image-rendering: crisp-edges; box-shadow: 0 0 80px rgba(140, 60, 180, 0.15); max-width: 100vw; max-height: 100vh; width: 100vw; height: auto; aspect-ratio: 16 / 9; touch-action: none; }
  @media (min-aspect-ratio: 16/9) { canvas { width: auto; height: 100vh; } }
  /* Fallback for browsers without aspect-ratio support (Safari <15, older Chromium) */
  @supports not (aspect-ratio: 16 / 9) {
    canvas { max-width: 177.78vh; max-height: 56.25vw; }
  }
  #hud { position: absolute; inset: 0; pointer-events: none; font-family: system-ui, sans-serif; }
  /* Loading screen — "opening the book" moment. Radial gradient, centered
     serif italic, gold hairline above the progress text. Matches the
     manuscript grammar used throughout the rest of the game. */
  #loading {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    color: #c9a86a;
    font-size: 13px;
    font-family: Georgia, "Cormorant Garamond", serif;
    font-style: italic;
    letter-spacing: 6px;
    background: radial-gradient(ellipse at center, #140a18 0%, #0a0610 60%, #050308 100%);
    gap: 18px;
  }
  #loading::before {
    content: "";
    width: 120px; height: 1px;
    background: linear-gradient(90deg, transparent, #c9a86a, transparent);
    opacity: 0.8;
  }
  #loading::after {
    content: "— ETHERA —";
    font-size: 28px;
    letter-spacing: 12px;
    color: #f4d9a0;
    text-shadow: 0 0 18px rgba(244, 217, 160, 0.45);
    font-style: normal;
    opacity: 0.9;
    order: -1;
  }
  @keyframes loadingBreathe {
    0%, 100% { opacity: 0.55; }
    50%      { opacity: 0.95; }
  }
  #loading { animation: loadingBreathe 2.4s ease-in-out infinite; }
  #deathScreen { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; flex-direction: column; background: radial-gradient(ellipse at center, #1a0a12 0%, #0a0410 60%, #050205 100%); color: #ddd; pointer-events: auto; font-family: Georgia, "Cormorant Garamond", serif; }
  #deathScreen h1 { font-size: 48px; margin: 0 0 12px; letter-spacing: 4px; color: #d8556a; text-shadow: 0 0 18px rgba(216, 85, 106, 0.6); font-weight: 400; }
  #deathScreen p { margin: 0 0 24px; opacity: 0.7; font-size: 14px; letter-spacing: 2px; font-style: italic; }
  #deathScreen button { background: #1a1220; color: #ddd; border: 1px solid #3a2a4a; padding: 12px 28px; font-size: 16px; cursor: pointer; letter-spacing: 2px; font-family: Georgia, serif; }
  #deathScreen button:hover { background: #2a1a30; border-color: #5a3a6a; }
  #restartBtn:hover {
    background: linear-gradient(180deg, #3a2030, #15080f) !important;
    border-color: #d85a5a !important;
    color: #ffbaba !important;
    box-shadow: 0 0 20px rgba(216,90,90,0.45), inset 0 0 10px rgba(255,160,160,0.1);
    letter-spacing: 5px !important;
  }
  /* #tip — removed. The hardcoded controls reminder was redundant with the
     contextual tips system in tips.js (showTip('first_dodge'), 'first_combat',
     etc. — which fires the first time a player uses each mechanic) and the
     how-to-play modal available from the menu footer. Once a player has
     done combat once, the line became clutter. */
  #build { position: absolute; right: 14px; bottom: 10px; font-size: 10px; opacity: 0.3; letter-spacing: 1px; }
  /* Subtle breathing glow on title text */
  @keyframes etheraGlow {
    0%, 100% { text-shadow: 0 0 18px rgba(218,184,110,0.45), 0 0 4px rgba(218,184,110,0.3); }
    50%      { text-shadow: 0 0 30px rgba(245,210,140,0.7),  0 0 8px rgba(245,210,140,0.5); }
  }
  .ethera-title { animation: etheraGlow 3.8s ease-in-out infinite; }

  /* Ambient sigil — slow rotation + gentle breathing opacity so it feels alive */
  @keyframes sigilDrift {
    0%   { transform: translate(-50%,-50%) rotate(0deg); opacity: 0.035; }
    50%  { transform: translate(-50%,-50%) rotate(180deg); opacity: 0.065; }
    100% { transform: translate(-50%,-50%) rotate(360deg); opacity: 0.035; }
  }
  #menuSigil { animation: sigilDrift 90s linear infinite; }

  /* MENU BUTTON POLISH — hover glow, scale, and inner light animation */
  #hud button { transition: transform 0.18s ease, box-shadow 0.18s ease, background 0.18s ease, border-color 0.18s ease, letter-spacing 0.18s ease, color 0.18s ease; }
  #hud button:hover { transform: translateY(-1px) scale(1.03); }
  /* Primary CTA — hover amplifies the existing mode tint. The shadow is set
     inline by JS per mode; we only brighten + expand letter-spacing. */
  #menuNewRunBtn { position: relative; }
  #menuNewRunBtn:hover {
    filter: brightness(1.18);
    letter-spacing: 9px !important;
    transform: translateY(-2px);
  }
  /* RESUME card — green-tinted, lifts and brightens on hover. */
  #menuResumeBtn:hover {
    filter: brightness(1.2);
    transform: translateY(-2px);
    box-shadow: inset 0 0 0 1px #a0e8b8, 0 0 28px rgba(134,183,154,0.45), inset 0 0 14px rgba(0,0,0,0.4) !important;
  }
  /* CTA halo slow breathe, syncs with title glow */
  @keyframes ctaHaloBreathe {
    0%, 100% { opacity: 0.7; }
    50%      { opacity: 1.0; }
  }
  #menuCtaHalo { animation: ctaHaloBreathe 3.8s ease-in-out infinite; }
  /* Hamlet firepit — irregular flicker so it doesn't look like a perfect
     pulse. Scales slightly, shifts opacity, offsets tint. */
  @keyframes hamletFireBreathe {
    0%   { opacity: 0.85; transform: translate(-50%,0) scale(1.00); }
    22%  { opacity: 1.00; transform: translate(-50%,0) scale(1.04); }
    38%  { opacity: 0.78; transform: translate(-50%,0) scale(0.97); }
    55%  { opacity: 0.95; transform: translate(-50%,0) scale(1.03); }
    72%  { opacity: 0.82; transform: translate(-50%,0) scale(0.99); }
    100% { opacity: 0.85; transform: translate(-50%,0) scale(1.00); }
  }
  /* Hamlet NPC portrait pixel-sharpness — pixel art only looks good with
     nearest-neighbor scaling. Applied to all hamlet NPC imgs. */
  .hamletNpcPortrait { image-rendering: pixelated; image-rendering: crisp-edges; }
  /* === MAIN MENU — unified borderless aesthetic ============================
     One color language: gold is the neutral. Cyan only for essence. Crimson
     only for curses. No purple, no peach. Hovers amplify inline styles; they
     never override them with a different visual language. */

  /* Meta cards (Sanctuary, Chronicles) — lift + brighten inset stroke */
  .menuMetaCard { transition: all 0.22s ease; }
  .menuMetaCard:hover {
    transform: translateY(-2px);
    box-shadow: inset 0 0 0 1px #c9a86a, 0 0 22px rgba(201,168,106,0.35), inset 0 0 14px rgba(0,0,0,0.4) !important;
  }
  /* Mode chips — unselected gets warmer + lifted on hover; selected state
     governed entirely by JS inline styles. */
  .menuModeChip { transition: all 0.22s ease; }
  .menuModeChip:hover {
    color: #c9a86a !important;
    transform: translateY(-1px);
    opacity: 1 !important;
  }
  /* Settings gear — silhouette, no plate. Rotates subtly on hover. */
  #menuSettingsBtn:hover {
    color: #f4d9a0 !important;
    opacity: 1 !important;
    transform: rotate(30deg);
    text-shadow: 0 0 10px rgba(244,217,160,0.55);
  }
  /* Curses corner chip — borderless text link. Hover glows in crimson. */
  #menuCursesBtn:hover {
    color: #ff9a9a !important;
    opacity: 1 !important;
    text-shadow: 0 0 10px rgba(216,128,128,0.6);
    transform: translateY(-1px);
  }
  /* Memory corner chip — borderless text link. Hover glows in cream-gold. */
  #menuMemoryBtn:hover {
    color: #f4d9a0 !important;
    opacity: 1 !important;
    text-shadow: 0 0 10px rgba(244,217,160,0.5);
    transform: translateY(-1px);
  }
  /* Volume indicator chip — borderless text link, shows current save slot.
     Click opens the VOLUMES modal. Hover glows in cream-gold. */
  #menuVolumeBtn:hover {
    color: #f4d9a0 !important;
    opacity: 1 !important;
    text-shadow: 0 0 10px rgba(244,217,160,0.5);
    transform: translateY(-1px);
  }
  /* Secondary text-links beneath the CTA — "visit the hamlet →" and
     "read the chronicles →". Hover glows in cream-gold with a slight
     lift, signaling interactivity without adding visual chrome. */
  #menuHamletLink:hover, #menuChroniclesLink:hover, #menuControlsLink:hover, #menuCreditsLink:hover {
    color: #f4d9a0 !important;
    opacity: 1 !important;
    text-shadow: 0 0 10px rgba(244,217,160,0.45);
    transform: translateY(-1px);
  }
  /* Volumes modal return button */
  #volumesCloseBtn:hover {
    color: #ff9a9a !important;
    opacity: 1 !important;
    text-shadow: 0 0 10px rgba(216,128,128,0.55);
    transform: translateX(-2px);
  }
  /* Smith's forge return button — same crimson-link treatment */
  #smithCloseBtn:hover {
    color: #ff9a9a !important;
    opacity: 1 !important;
    text-shadow: 0 0 10px rgba(216,128,128,0.55);
    transform: translateX(-2px);
  }
  /* Oracle modal return button */
  #oracleCloseBtn:hover {
    color: #ff9a9a !important;
    opacity: 1 !important;
    text-shadow: 0 0 10px rgba(216,128,128,0.55);
    transform: translateX(-2px);
  }
  /* Memory modal clear button — subtle darker hover */
  #memoryClearBtn:hover {
    color: #c9a86a !important;
    border-color: #6a5c48 !important;
    background: rgba(201,168,106,0.06) !important;
  }
  /* Memory modal back button — same crimson-link treatment as others */
  #memoryCloseBtn:hover {
    color: #ff9a9a !important;
    opacity: 1 !important;
    text-shadow: 0 0 10px rgba(216,128,128,0.55);
    transform: translateX(-2px);
  }
  /* Dialogue panel service button — amplify gold on hover */
  #dialogueServiceBtn:hover {
    filter: brightness(1.15);
    letter-spacing: 5px !important;
    transform: translateY(-1px);
  }
  #menuSettingsBackBtn:hover {
    background: rgba(60, 20, 20, 0.5) !important;
    color: #ffbaba !important;
    border-color: #a06060 !important;
  }
  /* Primary CTAs across overlays — unified gold hover treatment.
     Pause Resume, Shop Descend, Death-screen New Run all share this. */
  #pauseResumeBtn:hover, #restartBtn:hover, #winRestartBtn:hover {
    filter: brightness(1.18);
    letter-spacing: 8px !important;
    transform: translateY(-2px);
    box-shadow: inset 0 0 0 1px #f4d9a0, 0 0 26px rgba(244,217,160,0.4), inset 0 0 14px rgba(244,217,160,0.12) !important;
  }
  /* Secondary text links in pause — gold/italic journal + crimson END RUN */
  #pauseJournalBtn:hover {
    color: #f4d9a0 !important;
    opacity: 1 !important;
    text-shadow: 0 0 10px rgba(244,217,160,0.45);
  }
  #pauseQuitBtn:hover {
    color: #ff9a9a !important;
    opacity: 1 !important;
    text-shadow: 0 0 10px rgba(216,128,128,0.55);
  }
  /* Crimson text-link BACK buttons — unified treatment across modals. */
  #weaponBackBtn:hover,
  #achCloseBtn:hover,
  #journalBackBtn:hover,
  #menuSettingsBackBtn:hover,
  #cursesCloseBtn:hover,
  #tarotBackBtn:hover {
    color: #ff9a9a !important;
    opacity: 1 !important;
    text-shadow: 0 0 10px rgba(216,128,128,0.55);
    transform: translateX(-2px);
  }
  /* Shop + meta shop cards — lift on hover */
  .metaBuyBtn:hover { filter: brightness(1.15); box-shadow: 0 0 12px currentColor; }

  /* MODAL FADE-IN — fade overlays on display:flex instead of snap */
  @keyframes modalFadeIn {
    from { opacity: 0; transform: scale(0.97); }
    to   { opacity: 1; transform: scale(1); }
  }
  /* TAROT CARD reveal — each card rises + rotates into place */
  @keyframes cardReveal {
    from { opacity: 0; transform: translateY(60px) rotate(-10deg); }
    to   { opacity: 1; transform: translateY(0) rotate(-3deg); }
  }
  /* SHOP (between-floor) reveal animations */
  @keyframes winFadeIn {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes winCardSlide {
    from { opacity: 0; transform: translateY(40px) scale(0.92); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }
  /* LEGENDARY RELIC PULSE — ambient glow on death-screen trophy cards */
  @keyframes legendPulse {
    0%, 100% { box-shadow: 0 0 12px rgba(255,200,255,0.45), inset 0 0 8px rgba(0,0,0,0.5); }
    50%      { box-shadow: 0 0 24px rgba(255,200,255,0.75), 0 0 4px rgba(255,200,255,0.3), inset 0 0 8px rgba(0,0,0,0.5); }
  }
  /* Shop descend button — richer pulse than the generic pause button rule */
  #winRestartBtn:hover {
    background: linear-gradient(180deg,#5a4030,#2a1f10) !important;
    border-color: #f4d9a0 !important;
    box-shadow: 0 0 24px rgba(244,217,160,0.5), inset 0 0 12px rgba(255,220,140,0.2) !important;
    letter-spacing: 8px !important;
    color: #fff2c0 !important;
  }
  /* Shop cards — lift subtly on hover (override inline transition) */
  #shopRow > div:hover {
    transform: translateY(-4px) scale(1.02);
  }
  /* "Claim" buttons — bloom on hover */
  #shopRow .buyBtn:not(:disabled):hover {
    transform: scale(1.06);
    box-shadow: 0 0 14px currentColor;
    filter: brightness(1.12);
  }
  /* #menuTarotBtn rule removed — tarot is now a mode chip, not a separate button. */
  /* Tarot CTAs — same unified gold/crimson treatment as the other overlays. */
  #tarotBeginBtn:hover {
    filter: brightness(1.18);
    letter-spacing: 9px !important;
    transform: translateY(-2px);
    box-shadow: inset 0 0 0 1px #f4d9a0, 0 0 28px rgba(244,217,160,0.45), inset 0 0 14px rgba(244,217,160,0.12) !important;
  }
  #tarotBackBtn:hover {
    color: #ff9a9a !important;
    opacity: 1 !important;
    text-shadow: 0 0 10px rgba(216,128,128,0.55);
    transform: translateX(-2px);
  }
  #hud > div[style*="display:flex"], #hud > div[style*="display: flex"] { animation: modalFadeIn 0.28s ease-out; }
  #deathScreen[style*="flex"] { animation: modalFadeIn 0.35s ease-out; }
  /* Pedestal + achievements modals */
  #pauseRelics, #endStats, #endRelics { animation: modalFadeIn 0.4s ease-out 0.1s both; }
  /* Floor-map node pulse — draws the eye to reachable nodes. */
  @keyframes mapNodePulse {
    0%, 100% { transform: scale(1); }
    50%      { transform: scale(1.07); }
  }
  .floor-map-node:hover { transform: scale(1.1) !important; }
  /* Floor-map card reveal — fade + subtle rise on modal open. */
  @keyframes mapCardIn {
    0%   { opacity: 0; transform: translateY(6px) scale(0.985); }
    100% { opacity: 1; transform: translateY(0)   scale(1); }
  }
  /* Boss node ambient glow — legible goal even before it's reachable. */
  @keyframes bossPulse {
    0%, 100% { box-shadow: 0 0 18px rgba(255,154,85,0.35), inset 0 0 10px rgba(255,154,85,0.15); }
    50%      { box-shadow: 0 0 30px rgba(255,154,85,0.65), inset 0 0 14px rgba(255,154,85,0.28); }
  }
  /* Sanctuary node soft breath — heal-room affordance. */
  @keyframes sanctuaryBreath {
    0%, 100% { box-shadow: 0 0 14px rgba(134,227,168,0.30), inset 0 0 8px rgba(134,227,168,0.18); }
    50%      { box-shadow: 0 0 22px rgba(134,227,168,0.55), inset 0 0 12px rgba(134,227,168,0.28); }
  }
  /* Event node slow shimmer — hints at mystery without overclaiming attention. */
  @keyframes eventShimmer {
    0%, 100% { opacity: 0.85; }
    50%      { opacity: 1.0;  }
  }

  /* ==========================================================================
     ACCESSIBILITY — prefers-reduced-motion
     Disables the ambient / decorative animations (breathing title glow,
     sigil rotation, menu hover lifts, fade-in keyframes) for players with
     vestibular sensitivity. Canvas-side shake + hit-stop + zoom are scaled
     down separately by a11y.js at boot. Animations that convey essential
     state information (e.g. door-ready pulse) stay on.
     ========================================================================= */
  /* ==========================================================================
     RESPONSIVE / MOBILE — menu + overlay scaling for narrow viewports.
     Strategy: let the canvas CSS aspect-ratio keep the game area 16:9
     automatically (already wired above). Then scale the menu content
     column DOWN proportionally when the canvas is smaller than the
     design baseline (1280px wide). One CSS transform rule handles every
     menu element without per-pixel tweaks.
     ========================================================================= */
  @media (max-width: 900px) {
    .menuContent {
      transform: scale(0.72);
      transform-origin: center center;
    }
    /* Shrink the corner flourishes too so they don't eat the small viewport */
    .menuCorner {
      transform: scale(0.6);
      transform-origin: top left;
    }
  }
  @media (max-width: 600px) {
    .menuContent {
      transform: scale(0.52);
      transform-origin: center center;
    }
    .menuCorner { transform: scale(0.45); }
  }
  @media (max-width: 450px) {
    .menuContent {
      transform: scale(0.38);
      transform-origin: center center;
    }
    .menuCorner { transform: scale(0.32); }
  }

  /* ==========================================================================
     ROTATE-TO-LANDSCAPE PROMPT — phone portrait orientation covers the game
     with a full-screen instruction to rotate. Only fires when viewport is
     both narrow AND taller than wide (phone portrait, not desktop narrow
     window). Hides automatically when the user rotates to landscape.
     ========================================================================= */
  #rotatePrompt {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 99999;
    background: radial-gradient(ellipse at center, #140a18 0%, #0a0610 60%, #050308 100%);
    color: #f4d9a0;
    font-family: Georgia, serif;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 22px;
    text-align: center;
    padding: 24px;
    letter-spacing: 4px;
  }
  @media (max-width: 700px) and (orientation: portrait) {
    #rotatePrompt { display: flex; }
  }
  #rotatePrompt .ico {
    width: 72px; height: 72px;
    border: 2px solid #c9a86a;
    border-radius: 10px;
    position: relative;
    animation: rotateHint 2.4s ease-in-out infinite;
    box-shadow: 0 0 20px rgba(201, 168, 106, 0.3);
  }
  #rotatePrompt .ico::before {
    content: "";
    position: absolute;
    left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    width: 16px; height: 16px;
    background: #c9a86a;
    border-radius: 50%;
    opacity: 0.6;
  }
  @keyframes rotateHint {
    0%   { transform: rotate(0deg); }
    40%  { transform: rotate(-90deg); }
    60%  { transform: rotate(-90deg); }
    100% { transform: rotate(0deg); }
  }
  #rotatePrompt h2 {
    font-size: 18px;
    letter-spacing: 7px;
    font-weight: 400;
    margin: 0;
    font-style: italic;
  }
  #rotatePrompt p {
    font-size: 12px;
    letter-spacing: 3px;
    opacity: 0.7;
    font-style: italic;
    margin: 0;
    max-width: 280px;
  }

  @media (prefers-reduced-motion: reduce) {
    .ethera-title,
    #menuSigil,
    #menuCtaHalo,
    #loading,
    #hud button,
    #hud > div[style*="display:flex"],
    #hud > div[style*="display: flex"],
    #deathScreen[style*="flex"],
    #pauseRelics, #endStats, #endRelics,
    .floor-map-node,
    .floor-map-card {
      animation: none !important;
      transition: none !important;
    }
    #hud button:hover { transform: none !important; }
    #menuSettingsBtn:hover { transform: none !important; }
    .floor-map-node:hover { transform: none !important; }
  }

  /* ========================================================================
     BOSS INTRO — DOM overlay (not canvas drawImage).
     Previously the intro was rendered via ctx.drawImage onto the game canvas.
     On some GPU/driver combos the canvas composite pathway dims the JPG
     output even when getImageData returns correct bright RGB values — a
     known Chromium behavior for accelerated 2D canvas. The raw <img> tag
     bypasses that pathway entirely and renders identically to Chrome's
     native image viewer, where the JPG always shows bright.
     ======================================================================== */
  #bossIntroOverlay {
    position: absolute;
    inset: 0;
    z-index: 50;
    pointer-events: none;
    display: none;
    /* container-type would let us use cqh units for text sizing, but
       browser support varies — sticking with px + a media query fallback.
       Values match the canvas version at a 1280x720 baseline. */
  }
  #bossIntroOverlay.playing {
    display: block;
    animation: bossIntroFade 2.2s ease-out forwards;
  }
  @keyframes bossIntroFade {
    0%   { opacity: 0; }
    12%  { opacity: 1; }
    85%  { opacity: 1; }
    100% { opacity: 0; }
  }
  #bossIntroBackdrop {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
    /* Explicit color management: tell the browser the image is sRGB and
       don't auto-convert. Hedge against the original canvas-dimming issue
       reappearing under a different code path. */
    color-profile: sRGB;
    rendering-intent: absolute-colorimetric;
  }
  #bossIntroDim {
    position: absolute;
    inset: 55% 0 0 0;
    background: linear-gradient(to bottom, rgba(8, 5, 12, 0), rgba(8, 5, 12, 0.55));
    pointer-events: none;
  }
  #bossIntroFrame {
    position: absolute;
    left: 0; right: 0;
    top: 72%;
    text-align: center;
    color: #f4d9a0;
    font-family: Georgia, 'Cormorant Garamond', serif;
  }
  .bossIntroOrnament {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 120px;
    color: #c9a86a;
    font-style: italic;
    font-size: 22px;
    letter-spacing: 6px;
  }
  .bossIntroOrnament::before,
  .bossIntroOrnament::after {
    content: '';
    width: 220px;
    height: 1px;
    background: rgba(201, 168, 106, 0.9);
  }
  #bossIntroTag { margin-bottom: 18px; }
  #bossIntroName {
    font-weight: bold;
    font-size: 54px;
    letter-spacing: 4px;
    text-shadow: 0 0 22px rgba(245, 210, 140, 0.6);
  }
  #bossIntroFlavor {
    color: rgba(218, 184, 110, 0.85);
    font-style: italic;
    font-size: 16px;
    margin-top: 18px;
    margin-bottom: 20px;
  }
  /* Mobile scale-down — mirrors the menu responsive breakpoints in the
     doc further up. Under 900px viewport the fixed-px sizes become too
     big; proportionally reduce. */
  @media (max-width: 900px) {
    #bossIntroName { font-size: 42px; }
    #bossIntroTag, .bossIntroOrnament { font-size: 18px; }
    .bossIntroOrnament::before,
    .bossIntroOrnament::after { width: 160px; }
    .bossIntroOrnament { gap: 80px; }
  }
  @media (max-width: 600px) {
    #bossIntroName { font-size: 32px; letter-spacing: 3px; }
    #bossIntroFlavor { font-size: 13px; }
    .bossIntroOrnament::before,
    .bossIntroOrnament::after { width: 100px; }
    .bossIntroOrnament { gap: 50px; }
  }
</style>
</head>
<body>
<!-- Rotate-to-landscape prompt. Shown only on phone portrait via CSS media
     query. Hides automatically when user rotates — no JS required. -->
<div id="rotatePrompt">
  <div class="ico"></div>
  <h2>— ROTATE YOUR DEVICE —</h2>
  <p>Ethera is a landscape game · turn your phone sideways to begin the descent</p>
</div>
<div id="stage">
  <canvas id="game" width="1280" height="720"></canvas>
  <div id="hud">
    <!-- Controls reminder removed — tips.js's contextual onboarding system
         (showTip('first_dodge') etc.) surfaces the relevant control the first
         time each mechanic fires, which is less cluttery than a permanent
         bottom-left legend. How-to-play modal is available from the menu. -->
    <div id="build">Ethera · v0.1</div>
  </div>
  <div id="loading">Loading…</div>
  <!-- Boss intro overlay — DOM-based replacement for the canvas drawImage
       path. See <style> above for the why. Populated dynamically from
       src/bossIntroDom.js; sits inside #stage so it inherits canvas layout. -->
  <div id="bossIntroOverlay" aria-hidden="true">
    <img id="bossIntroBackdrop" alt="">
    <div id="bossIntroDim"></div>
    <div id="bossIntroFrame">
      <div class="bossIntroOrnament" id="bossIntroTag">BOSS</div>
      <div id="bossIntroName"></div>
      <div id="bossIntroFlavor"></div>
      <div class="bossIntroOrnament"></div>
    </div>
  </div>
  <div id="deathScreen">
    <h1>YOU DIED</h1>
    <p>the ooze takes you back</p>
    <button id="restartBtn">RESTART</button>
  </div>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
